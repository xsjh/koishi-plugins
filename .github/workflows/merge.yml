
      - name: Discover and merge Koishi repositories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER="xsjh"

          # 获取仓库列表
          gh api --paginate \
            "users/$OWNER/repos?per_page=100" \
            --jq '.[] | select(.name | startswith("koishi")) | [.name, .default_branch] | @tsv' \
            > /tmp/koishi-repos.txt

          echo "发现以下 Koishi 仓库："
          cat /tmp/koishi-repos.txt

          # 避免未发现仓库时错误地显示成功
          if [ ! -s /tmp/koishi-repos.txt ]; then
            echo "::error::未找到 Koishi 仓库，请检查用户名和 API 权限"
            exit 1
          fi

          # 依次导入，保留完整提交历史
          while IFS=$'\t' read -r repo branch; do
            [ -n "$repo" ] || continue

            if [ "$repo" = "koishi-plugins" ]; then
              continue
            fi

            if [ -d "$repo" ]; then
              echo "已存在，跳过：$repo"
              continue
            fi

            echo "正在合并：$OWNER/$repo"

            git subtree add \
              --prefix="$repo" \
              "https://github.com/$OWNER/$repo.git" \
              "$branch"

          done < /tmp/koishi-repos.txt
